<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- ================================================================= -->
  <!-- GOOGLE SEARCH CONSOLE VERIFICATION TAG (Paste your code below)    -->
  <!-- ================================================================= -->
  <meta name="google-site-verification" content="PASTE_YOUR_GOOGLE_VERIFICATION_CODE_HERE" />
  <!-- ================================================================= -->

  <meta name="description" content="Official Android APK catalog and direct downloads for SEnterpriseHub utilities and field applications." />
  <meta name="theme-color" content="#f8fafc" />
  <title>SEnterpriseHub | App Catalog & Direct Downloads</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-wrapper">
    <header class="hero">
      <div class="brand-tag">Utility App Store</div>
      <h1 class="hero-title">SR App Studio Android Applications</h1>
      <p class="hero-subtitle">Direct browser APK downloads and dedicated web pages for all published utilities.</p>
      
      <div class="search-container">
        <input 
          type="search" 
          id="search-input" 
          aria-label="Search applications"
          placeholder="Search apps by name, description, or keyword..." 
          autocomplete="off"
        />
      </div>
    </header>

    <main class="catalog-section">
      <div id="status-container" class="status-container" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p>Loading application catalog...</p>
      </div>
      <div id="app-grid" class="app-grid" style="display: none;"></div>
    </main>

    <footer class="site-footer">
      <p>© SEnterpriseHub · All APKs verified directly from GitHub releases</p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
