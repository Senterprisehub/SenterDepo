  <link rel="stylesheet" href="style.css" />

    "name": "SR Apps Studio",

    "url": "https://srappstudio.vercel.app/"

<body>
  <div class="site-wrapper">
    <header class="hero">
      <div class="brand-tag">Application Hub</div>
      <h1 class="hero-title">SR App Studio Android & Web Applications</h1>
      <p class="hero-subtitle">Direct browser APK downloads and dedicated web utilities.</p>
      
      <div class="search-container">
        <input 
          type="search" 
          id="search-input" 
          aria-label="Search applications"
          placeholder="Search apps by name, description, or keyword..." 
          autocomplete="off"
        />
      </div>
    </header>

    <main class="catalog-section">
      <div id="status-container" class="status-container" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p>Loading application catalog...</p>
      </div>
      <div id="app-grid" class="app-grid" style="display: none;"></div>
    </main>

    <footer class="site-footer">
      <p>© SEnterpriseHub · All APKs verified directly from official releases</p>
    </footer>
  </div>

  <script src="app.js" defer></script>
