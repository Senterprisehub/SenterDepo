name: Update App Manifest Cache

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  push:
    branches:
      - main
    paths:
      - 'apps.json'
      - 'scripts/**'
  workflow_dispatch:
  repository_dispatch:
    types: [app_released]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Releases & Build Manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-manifest.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps-data.json
          
          # Only commit if there are actual diffs
          if git diff --staged --quiet; then
            echo "No changes in release data. Exiting cleanly."
          else
            git commit -m "chore(manifest): auto-sync latest app releases [skip ci]"
            git push origin main
          fi
